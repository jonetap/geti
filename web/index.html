<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GETI · 全球升级张力指数</title>
<meta name="description" content="用公开新闻与事件流计算的全球升级张力指数，不是开战概率。" />
<style>
  :root{
    --bg:#080b11; --panel:#0f1621; --panel2:#131c29; --line:#1d2937;
    --txt:#c9d7e6; --mut:#6c8099; --dim:#48586c;
    --calm:#2dd4bf; --warm:#fbbf24; --hot:#fb923c; --sev:#f43f5e;
    --accent:var(--warm);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{background-image:radial-gradient(900px 500px at 50% -10%,rgba(251,191,36,.06),transparent 70%)}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font:600 30px/1 var(--mono);letter-spacing:.14em;margin:0;color:#eaf2fb}
  .brand .sub{color:var(--mut);font-size:12.5px;letter-spacing:.04em}
  .live{display:inline-flex;align-items:center;gap:6px;font:11px/1 var(--mono);
    color:var(--calm);border:1px solid rgba(45,212,191,.3);border-radius:20px;padding:4px 9px}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--calm);
    box-shadow:0 0 8px var(--calm);animation:p 2.4s ease-in-out infinite}
  @keyframes p{50%{opacity:.35}}
  .meta{display:flex;gap:16px;flex-wrap:wrap;font:11.5px/1.4 var(--mono);color:var(--dim)}
  .meta b{color:var(--mut);font-weight:500}

  /* ---------- hero ---------- */
  .hero{display:grid;grid-template-columns:340px 1fr;gap:16px;margin-bottom:16px}
  @media(max-width:820px){.hero{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px}
  .card h2{font:600 12px/1 var(--mono);letter-spacing:.14em;color:var(--mut);
    margin:0 0 14px;text-transform:uppercase}

  .gauge-card{display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
  .gauge{width:100%;max-width:300px;display:block;margin:2px 0 -6px}
  .gauge .track{fill:none;stroke:#18222f;stroke-width:14;stroke-linecap:round}
  .gauge .fill{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;
    transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1),stroke .6s}
  .gauge-num{position:absolute;top:104px;text-align:center;pointer-events:none}
  .gauge-num b{display:block;font:600 54px/1 var(--mono);color:#f3f8ff;letter-spacing:-.02em}
  .band{margin-top:7px;font:11px/1 var(--mono);letter-spacing:.18em;color:var(--accent)}
  .scale{display:flex;justify-content:space-between;width:100%;max-width:300px;
    font:10px/1 var(--mono);color:var(--dim);margin-top:2px}
  .hero-foot{display:flex;width:100%;gap:14px;margin-top:16px;padding-top:14px;
    border-top:1px solid var(--line);justify-content:space-between}
  .kpi{text-align:left}
  .kpi span{display:block;font:10px/1 var(--mono);color:var(--dim);letter-spacing:.1em;margin-bottom:6px}
  .kpi b{font:600 17px/1 var(--mono);color:var(--txt)}
  .kpi b.up{color:var(--sev)} .kpi b.down{color:var(--calm)}

  /* ---------- trend ---------- */
  .head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .head-row h2{margin:0}
  .tabs{display:flex;gap:4px;background:#0b121b;border:1px solid var(--line);border-radius:8px;padding:3px}
  .tabs button{background:none;border:0;color:var(--dim);font:11px/1 var(--mono);
    padding:5px 9px;border-radius:6px;cursor:pointer}
  .tabs button.on{background:#1b2735;color:#e6eef8}
  #spark{width:100%;height:190px;display:block}
  .spark-line{fill:none;stroke:var(--accent);stroke-width:2}
  .spark-area{fill:url(#gradFill);stroke:none}
  .spark-grid{stroke:#1a2531;stroke-width:1}
  .spark-lbl{fill:var(--dim);font:10px var(--mono)}
  .stats{display:flex;gap:22px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}

  /* ---------- columns ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:340px 1fr;gap:16px}
  @media(max-width:820px){.grid,.grid2{grid-template-columns:1fr}}

  /* bars */
  .bar-row{display:grid;grid-template-columns:86px 1fr 52px;gap:10px;align-items:center;margin-bottom:11px}
  .bar-row .nm{font-size:12.5px;color:var(--txt)}
  .bar-row .nm em{display:block;font:10px/1.3 var(--mono);color:var(--dim);font-style:normal}
  .track{height:7px;background:#0c141d;border-radius:4px;overflow:hidden;position:relative}
  .track i{display:block;height:100%;border-radius:4px;background:var(--accent);
    transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .track i.neg{background:#3b82f6}
  .bar-row .val{font:11.5px/1 var(--mono);text-align:right;color:var(--mut)}

  /* regions */
  .reg{display:grid;grid-template-columns:96px 1fr 46px 62px;gap:10px;align-items:center;
    padding:7px 0;border-bottom:1px dashed #16202c}
  .reg:last-child{border-bottom:0}
  .reg .nm{font-size:12.5px}
  .reg .nm small{display:block;font:10px/1.2 var(--mono);color:var(--dim)}
  .reg .sc{font:12px/1 var(--mono);text-align:right}
  .reg .dl{font:11px/1 var(--mono);text-align:right;color:var(--dim)}
  .reg .dl.up{color:var(--sev)} .reg .dl.down{color:var(--calm)}
  .excl{opacity:.4;filter:saturate(.25)}
  .excl .track i{background:var(--dim)}

  /* events */
  .ev{display:block;padding:11px 0;border-bottom:1px solid #141d28}
  .ev:last-child{border-bottom:0}
  .ev:hover .ti{color:#fff}
  .ev-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .sev{font:10px/1 var(--mono);padding:3px 6px;border-radius:4px;border:1px solid}
  .sev5{color:#ff7a8a;border-color:#7f2436;background:#2a0f16}
  .sev4{color:#fda4af;border-color:#612736;background:#241016}
  .sev3{color:var(--warm);border-color:#5c4a1a;background:#221c0c}
  .sev2,.sev1{color:var(--mut);border-color:#26313f;background:#111923}
  .ev .ti{font-size:13.5px;line-height:1.45;color:var(--txt)}
  .ev-meta{display:flex;gap:12px;flex-wrap:wrap;font:10.5px/1 var(--mono);color:var(--dim);margin-top:5px}
  .ev-meta .ok{color:var(--calm)}
  .ev-meta .warn{color:var(--warm)}
  .brk{padding:12px 0;border-bottom:1px solid #141d28}
  .brk .ti{font-size:13px;font-weight:500;color:#ffe9d6}
  .brk .tag{font:10px/1 var(--mono);color:var(--sev);letter-spacing:.1em}

  footer{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
    color:var(--dim);font-size:11.5px;line-height:1.8}
  footer b{color:var(--mut);font-weight:500}
  .err{max-width:640px;margin:60px auto;padding:20px;border:1px solid #5c2334;
    border-radius:12px;background:#1a0d13;color:#ffc9d4;font:13px/1.7 var(--mono)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>GETI</h1>
      <div>
        <div class="sub">全球升级张力指数 · Global Escalation Tension Index</div>
        <div class="live" id="live"><i></i><span>加载中</span></div>
      </div>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <main id="app" hidden>
    <section class="hero">
      <div class="card gauge-card">
        <svg class="gauge" viewBox="0 0 280 170" aria-hidden="true">
          <path class="track" d="M25 145 A115 115 0 0 1 255 145" />
          <path class="fill" id="arc" d="M25 145 A115 115 0 0 1 255 145"
                stroke-dasharray="0 361.28" />
        </svg>
        <div class="gauge-num"><b id="geti">–</b><div class="band" id="band">–</div></div>
        <div class="scale"><span>0 平静</span><span>50 中性</span><span>100 极高</span></div>
        <div class="hero-foot">
          <div class="kpi"><span>24H 变动</span><b id="delta">–</b></div>
          <div class="kpi"><span>数据置信度</span><b id="conf">–</b></div>
          <div class="kpi"><span>主要驱动</span><b id="driver" style="font-size:14px">–</b></div>
        </div>
      </div>

      <div class="card">
        <div class="head-row">
          <h2>指数走势</h2>
          <div class="tabs" id="rangeTabs">
            <button data-n="7">7 天</button>
            <button data-n="30" class="on">30 天</button>
            <button data-n="90">90 天</button>
            <button data-n="0">全部</button>
          </div>
        </div>
        <svg id="spark" viewBox="0 0 720 190" preserveAspectRatio="none">
          <defs>
            <linearGradient id="gradFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--accent)" stop-opacity=".28" />
              <stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
            </linearGradient>
          </defs>
        </svg>
        <div class="stats" id="stats"></div>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>分项驱动 · 主驱动区域</h2>
        <div id="comps"></div>
      </div>
      <div class="card">
        <h2>区域张力分解</h2>
        <div id="regions"></div>
      </div>
    </section>

    <section class="grid2">
      <div class="card">
        <h2>突发 · 待核实</h2>
        <div id="breaking"></div>
      </div>
      <div class="card">
        <h2>事件流</h2>
        <div id="events"></div>
      </div>
    </section>

    <footer id="foot"></footer>
  </main>

  <div class="err" id="err" hidden></div>
</div>

<script>
const COMP = {military:"军事升级", physical:"物理征兆", diplomacy:"外交", economy:"经济", internal:"内部动荡", narrative:"信息/叙事"};
const REG = {MIDDLE_EAST:"中东", RUSSIA_CIS:"俄与独联体", EAST_ASIA:"东亚", EUROPE:"欧洲", SOUTH_ASIA:"南亚", AFRICA:"非洲", AMERICAS:"美洲", OTHER:"未归属"};

const $ = (id) => document.getElementById(id);
const pct = (v) => (v == null ? "–" : Math.round(v) + "%");

function bandOf(v){
  if (v >= 75) return {t:"极高", c:"var(--sev)"};
  if (v >= 62) return {t:"高", c:"var(--hot)"};
  if (v >= 54) return {t:"偏高", c:"var(--warm)"};
  if (v >= 46) return {t:"中性", c:"var(--mut)"};
  if (v >= 36) return {t:"偏冷", c:"var(--calm)"};
  return {t:"平静", c:"var(--calm)"};
}
function ago(iso){
  const t = new Date(iso).getTime();
  if (!t) return "";
  const h = (Date.now() - t) / 36e5;
  if (h < 1) return Math.max(1, Math.round(h * 60)) + " 分钟前";
  if (h < 36) return Math.round(h) + " 小时前";
  return Math.round(h / 24) + " 天前";
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- 仪表盘 ---------------- */
function drawGauge(v){
  const len = Math.PI * 115;            // 半圆周长
  const frac = Math.max(0, Math.min(1, v / 100));
  $("arc").style.strokeDasharray = (frac * len).toFixed(1) + " " + len.toFixed(1);
}

/* ---------------- 走势 ---------------- */
let SERIES = [], RANGE = 30;
function drawSpark(){
  const svg = $("spark");
  const W = 720, H = 190, PL = 34, PR = 10, PT = 12, PB = 24;
  const src = RANGE ? SERIES.slice(-RANGE) : SERIES;
  if (src.length < 2) { svg.innerHTML = '<text x="20" y="40" class="spark-lbl">历史不足，暂不画图</text>'; return; }
  const ys = src.map(d => d.geti);
  let lo = Math.min(...ys, 45) - 4, hi = Math.max(...ys, 55) + 4;
  if (hi - lo < 12) { lo -= 6; hi += 6; }
  const x = i => PL + (W - PL - PR) * (i / (src.length - 1));
  const y = v => PT + (H - PT - PB) * (1 - (v - lo) / (hi - lo));

  let grid = "";
  for (let k = 0; k < 4; k++){
    const v = lo + (hi - lo) * k / 3, yy = y(v);
    grid += `<line class="spark-grid" x1="${PL}" y1="${yy.toFixed(1)}" x2="${W - PR}" y2="${yy.toFixed(1)}"/>`;
    grid += `<text class="spark-lbl" x="4" y="${(yy + 3).toFixed(1)}">${Math.round(v)}</text>`;
  }
  // 中性线 50
  if (lo < 50 && hi > 50){
    grid += `<line x1="${PL}" y1="${y(50).toFixed(1)}" x2="${W - PR}" y2="${y(50).toFixed(1)}" stroke="#2a3746" stroke-dasharray="4 4"/>`;
  }
  const pts = src.map((d, i) => `${x(i).toFixed(1)},${y(d.geti).toFixed(1)}`);
  const area = `M${PL},${H - PB} L${pts.join(" L")} L${x(src.length - 1).toFixed(1)},${H - PB} Z`;
  const first = src[0].date, last = src[src.length - 1].date;
  svg.innerHTML = grid +
    `<path class="spark-area" d="${area}"/>` +
    `<polyline class="spark-line" points="${pts.join(" ")}"/>` +
    `<circle cx="${x(src.length - 1).toFixed(1)}" cy="${y(ys[ys.length - 1]).toFixed(1)}" r="3.5" fill="var(--accent)"/>` +
    `<text class="spark-lbl" x="${PL}" y="${H - 6}">${first.slice(5)}</text>` +
    `<text class="spark-lbl" x="${W - PR}" y="${H - 6}" text-anchor="end">${last.slice(5)}</text>`;
  $("spark").style.setProperty("--accent", getComputedStyle(document.documentElement).getPropertyValue("--accent"));
}

/* ---------------- 渲染 ---------------- */
function render(S){
  const g = S.geti, band = bandOf(g);
  document.documentElement.style.setProperty("--accent", band.c);
  $("geti").textContent = g.toFixed(1);
  $("band").textContent = band.t + " · " + S.date;
  drawGauge(g);

  const dz = S.delta_z, dp = S.delta_pts;
  const up = dp > 0;
  $("delta").innerHTML = (up ? "▲ " : dp < 0 ? "▼ " : "· ") +
    (dp >= 0 ? "+" : "") + dp.toFixed(1) + " 分";
  $("delta").className = up ? "up" : dp < 0 ? "down" : "";
  $("delta").title = dz == null ? "历史不足，无法给出 z 分数" : "z = " + dz;
  $("conf").textContent = pct(S.confidence * 100);
  $("driver").textContent = S.driver_label || "—";

  // meta
  const satN = S.coverage.components_saturated || 0;
  const satAll = S.coverage.components_covered || 0;
  const satBad = satAll > 0 && satN / satAll > 0.4;
  $("meta").innerHTML = [
    ["生成", new Date(S.generated_at).toLocaleString("zh-CN", {hour12:false})],
    ["窗口", S.history_days + " 天"],
    ["版本", S.index_version],
    ["源", `${S.coverage.sources_ok} 正常 / ${S.coverage.sources_failed} 异常`],
    ["条目", String(S.coverage.items)],
    satBad
      ? ["<span style=\"color:var(--sev)\">⚠ 标定饱和</span>", `${satN}/${satAll} 分项贴顶，指数此刻不可信`]
      : ["饱和", `${satN}/${satAll}`],
  ].map(([k, v]) => `<span><b>${k}</b> ${esc(v)}</span>`).join("");

  // live badge
  const live = $("live");
  if (S.coverage.mode === "synthetic"){
    live.style.color = "var(--warm)"; live.style.borderColor = "#5c4a1a";
    live.querySelector("i").style.background = "var(--warm)";
    live.querySelector("i").style.boxShadow = "0 0 8px var(--warm)";
    live.querySelector("span").textContent = "示例数据 · 非真实局势";
  } else {
    live.querySelector("span").textContent = "实时数据 · " + ago(S.generated_at);
  }

  // 分项
  const comps = S.components || [];
  $("comps").innerHTML = comps.map(c => {
    const has = c.score != null;
    const w = has ? Math.max(2, Math.min(100, c.score)) : 0;
    const neg = has && c.z < 0;
    return `<div class="bar-row">
      <div class="nm">${esc(c.label)}<em>权重 ${Math.round(c.weight * 100)}%</em></div>
      <div class="track"><i class="${neg ? "neg" : ""}" style="width:${w}%"></i></div>
      <div class="val">${has ? (c.z > 0 ? "+" : "") + c.z.toFixed(1) + "σ" : "历史不足"}</div>
    </div>`;
  }).join("") || '<div class="val">该区域数据不足</div>';

  // 区域
  const regions = (S.regions || []).slice(0, 8);
  $("regions").innerHTML = regions.map(r => {
    const d = r.delta, cls = d > 0.5 ? "up" : d < -0.5 ? "down" : "";
    const drv = (r.drivers || []).map(([k]) => COMP[k] || k).join(" · ");
    return `<div class="reg ${r.excluded ? "excl" : ""}">
      <div class="nm">${esc(r.label)}<small>${esc(drv || "—")}</small></div>
      <div class="track"><i style="width:${Math.max(2, Math.min(100, r.score))}%"></i></div>
      <div class="sc">${r.score.toFixed(1)}</div>
      <div class="dl ${cls}">${d > 0 ? "+" : ""}${d.toFixed(1)}</div>
    </div>`;
  }).join("") || '<div class="val">历史不足，暂不分解</div>';

  // 突发
  const brk = S.breaking || [];
  $("breaking").innerHTML = brk.length ? brk.map(b => `
    <div class="brk">
      <div class="tag">待核实 · 仅 ${b.origins} 个独立源</div>
      <a class="ti" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.title)}</a>
      <div class="ev-meta"><span>${esc(COMP[b.component] || b.component)}</span>
      <span>${esc(REG[b.region] || "未归属")}</span><span>${ago(b.published)}</span></div>
    </div>`).join("")
    : '<div class="val">当前没有达到突发阈值的未确认事件</div>';

  // 事件流
  const evs = S.events || [];
  $("events").innerHTML = evs.map(e => {
    const conf = Math.round(e.confidence * 100);
    return `<div class="ev">
      <div class="ev-top">
        <span class="sev sev${e.severity}">S${e.severity}</span>
        <span class="ev-meta" style="margin:0">${esc(COMP[e.component] || e.component)}</span>
      </div>
      <a class="ti" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>
      <div class="ev-meta">
        <span class="${e.origins >= 3 ? "ok" : "warn"}">${e.origins} 个独立源</span>
        <span>可信度 ${conf}%</span>
        <span>${esc(REG[e.region] || "未归属")}</span>
        <span>${ago(e.published)}</span>
      </div>
    </div>`;
  }).join("") || '<div class="val">暂无事件</div>';

  // 统计
  $("stats").innerHTML = [
    ["样本天数", S.history_days],
    ["覆盖分项", `${S.coverage.components_covered}/${S.coverage.components_required}`],
    ["去重后事件", S.coverage.clusters],
    ["独立起源", S.coverage.origins],
  ].map(([k, v]) => `<div class="kpi"><span>${k}</span><b>${esc(v)}</b></div>`).join("");

  // footer
  $("foot").innerHTML = `
    <p><b>这不是开战概率。</b>GETI 是 0–100 的<b>信号强度</b>：50 = 与过去 ${S.history_days} 天中位数持平。
    概率需要可校准的基准率，而"国家间新开战"每年个位数，几十条新闻撑不起三位有效数字。</p>
    <p>算法：每个分项按<b>区域</b>做中位数/MAD 稳健标准化并截断在 ±3σ，加权求和
    (军事 .26 / 物理 .22 / 外交 .18 / 经济 .15 / 内部 .11 / 叙事 .08)，经 tanh 映射到 0–100；
    全球指数 = 0.5·最强区域 + 0.5·P90 区域。<b>历史不足 14 天不给 z 分数</b>；
    <b>未归属区域（说不清在哪的事件）不参与全球指数</b>，只展示。</p>
    <p><b>${esc(S.coverage.note || "")}</b> 数据源：GDELT 事件流 + 公共 RSS。版本 ${esc(S.index_version)}。</p>`;
}

/* ---------------- 启动 ---------------- */
async function boot(){
  try {
    const res = await fetch("snapshot.json", {cache: "no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    const S = await res.json();
    SERIES = S.series || [];
    render(S);
    $("app").hidden = false;
    drawSpark();
    document.querySelectorAll("#rangeTabs button").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll("#rangeTabs button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        RANGE = Number(b.dataset.n);
        drawSpark();
      };
    });
    window.addEventListener("resize", () => drawSpark());
  } catch (e) {
    $("err").hidden = false;
    $("err").innerHTML = "<b>无法加载 snapshot.json</b><br>" + esc(e.message) +
      "<br><br>本地预览时请在该目录起一个静态服务器：<br><code>python -m http.server 8080</code><br>" +
      "（浏览器禁止 file:// 页面 fetch 本地 JSON。）";
  }
}
boot();
</script>
</body>
</html>
